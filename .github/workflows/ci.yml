name: Testes BDD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar o navegador
        run: python -m playwright install --with-deps chromium

      # continue-on-error para o relatório ser publicado mesmo quando um
      # cenário falha. É exatamente aí que o relatório mais importa.
      - name: Executar os cenários
        id: testes
        continue-on-error: true
        run: pytest

      - name: Recuperar o histórico do Allure
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Gerar o relatório Allure
        uses: simple-elf/allure-report-action@v1.12
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      - name: Publicar o relatório no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Publicar evidências como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-bdd
          path: |
            relatorio.html
            evidencias/
            allure-results/
          if-no-files-found: ignore

      # O passo anterior sempre roda; este devolve o resultado real dos
      # testes para o job, para que o selo do README não minta.
      - name: Refletir o resultado dos testes
        if: steps.testes.outcome == 'failure'
        run: |
          echo "Um ou mais cenários falharam. Veja o relatório publicado."
          exit 1
